stages: [test, deploy]

default:
  image: golang:1.26

variables:
  GOFLAGS: -mod=mod
  GOPATH: $CI_PROJECT_DIR/.go

cache:
  key: go-mod
  paths: [.go/pkg/mod]

test:
  stage: test
  script:
    - test -z "$(gofmt -l .)"
    - go vet ./...
    - go test ./...

pages:
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - sh scripts/build-pages.sh
  artifacts:
    paths: [public]
